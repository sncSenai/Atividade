<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Social links profile</title>
</head>

<body>

  <main>
    <div class="imagem">
      <img class="imagemDePerfil" src="assets/images/avatar-jessica.jpeg" alt="Imagem de Perfil">
    </div>
    <div class="SubTittle">

      <h2>Jessica Randall</h2>
      <p style="color:hsl(75, 94%, 57%);font-size: 15px;">London, United Kingdom</p>

      <p style="font-size: 14px;">"Front-end developer and avid reader."</p>

    </div>

    <div class="buttons">
      <button class="button-1" role="button">GitHub</button>
      <button class="button-1" role="button">Frontend Mentor</button>
      <button class="button-1" role="button">LinkedIn</button>
      <button class="button-1" role="button">Twitter</button>
      <button class="button-1" role="button">Instagram</button>
    </div>

  </main>

</body>

</html>
